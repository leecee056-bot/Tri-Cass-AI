<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tri Cass AI</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif;
        background: radial-gradient(120% 90% at 20% 20%, #1a2230 0%, #0c0f14 55%, #090b10 100%);
        color: #eef2f7;
      }
      .stage {
        height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        max-width: 420px;
      }
      .logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        opacity: 0;
        transform: translateX(-18px);
        animation: fadeSlide 900ms cubic-bezier(0.22, 1, 0.36, 1) 120ms forwards;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.45));
      }
      .copy {
        opacity: 0;
        transform: translateX(-14px);
        animation: fadeSlide 950ms cubic-bezier(0.22, 1, 0.36, 1) 320ms forwards;
      }
      .copy h1 {
        margin: 0;
        font-size: 1.55rem;
        font-weight: 650;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }
      .copy p {
        margin: 6px 0 0;
        color: rgba(230, 236, 245, 0.72);
        font-size: 0.92rem;
      }
      .bar {
        position: absolute;
        left: 18%;
        right: 18%;
        bottom: 18%;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #5dcf94, #7ee0b0);
        animation: load 1.35s ease-in-out 200ms forwards;
      }
      @keyframes fadeSlide {
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes load {
        to {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="brand">
        <img class="logo" src="./brand/tri-cass-mascot.png" alt="" width="72" height="72" />
        <div class="copy">
          <h1>Tri Cass AI</h1>
          <p>Local coding companion</p>
        </div>
      </div>
      <div class="bar" aria-hidden="true"><i></i></div>
    </div>
  </body>
</html>
